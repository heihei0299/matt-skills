name: CI Guard

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: '回滚 tag（如 v1.3.4），仅手动回滚时填'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build template
        run: npm run build:template

      - name: Check template drift
        run: |
          if ! git diff --exit-code -- template/ .agents/skills/ci-guard/ config/proprietary.json 2>&1; then
            echo "::error::template/ 与 .agents/skills 漂移，请本地执行 npm run build:template 并提交"
            git diff --stat
            exit 1
          fi
          echo "template drift check passed"

  publish:
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git branch -a --contains "$TAG_COMMIT" | grep -qE "main|origin/main"; then
            echo "Tag $GITHUB_REF is not on main branch, abort"
            git branch -a --contains "$TAG_COMMIT" || true
            exit 1
          fi
          echo "Tag $GITHUB_REF is on main, proceeding"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $TAG from tag $GITHUB_REF"
          npm version "$TAG" --no-git-tag-version --allow-same-version
          echo "package.json version is now $(node -p "require('./package.json').version")"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish verification (npm view)
        id: post_check
        continue-on-error: true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Verifying npm registry for @heihei0299/matt-skills@$VERSION"
          for i in 1 2 3 4 5; do
            if npm view "@heihei0299/matt-skills@$VERSION" version 2>&1 | grep -q "$VERSION"; then
              echo "✅ npm view verified $VERSION"
              exit 0
            fi
            echo "Retry $i/5: not yet available, sleep 10s"
            sleep 10
          done
          echo "::error::npm view failed for @heihei0299/matt-skills@$VERSION after 50s"
          exit 1

      - name: Verify gh release exists
        if: steps.post_check.outcome == 'success'
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          gh release view "v$TAG" --json tagName -q .tagName | grep -q "v$TAG" && echo "✅ gh release v$TAG exists" || echo "::warning::gh release v$TAG not found (may be auto-created later)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on post-check failure
        if: failure() && steps.post_check.outcome == 'failure'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          gh issue create \
            --title "chore(release): v$TAG 发布后自检失败" \
            --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          npm view @heihei0299/matt-skills@$VERSION 失败（registry 50s 内未可见）或 gh release 校验失败。
          请人工检查：npm 是否 409/401，registry 延迟，或 tag 与 package.json 不一致。
          手动回滚：Actions → CI Guard → Run workflow → 填 rollback_tag=v$TAG（72h 内可 npm unpublish，gh release delete 已备）" \
            --label "release-failure" 2>&1 || echo "gh issue create failed or label missing, fallback without label" && \
          gh issue create \
            --title "chore(release): v$TAG 发布后自检失败" \
            --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>&1 || true
          echo "::error::post-publish verification failed, issue created (no auto delete tag per policy)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rollback:
    if: inputs.rollback_tag != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Manual rollback (delete release, guide npm unpublish)
        run: |
          TAG="${{ inputs.rollback_tag }}"
          if [ -z "$TAG" ]; then echo "rollback_tag empty, skip"; exit 0; fi
          # normalize v prefix
          if [[ "$TAG" != v* ]]; then TAG="v$TAG"; fi
          echo "Rollback target: $TAG"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Deleting gh release $TAG"
            gh release delete "$TAG" --yes || echo "gh release delete failed or not exist"
          else
            echo "gh release $TAG not found, skip delete"
          fi
          VERSION=${TAG#v}
          echo "If npm package @heihei0299/matt-skills@$VERSION was published within 72h, run manually:"
          echo "  npm unpublish @heihei0299/matt-skills@$VERSION  # requires npm token with unpublish permission"
          echo "Tag itself not auto-deleted from git per policy; to delete git tag:"
          echo "  git tag -d $TAG && git push origin :refs/tags/$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
