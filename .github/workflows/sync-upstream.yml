name: Sync upstream skills

on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 02:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 ref（默认 HEAD）'
        required: false
        default: 'HEAD'
      dry_run:
        description: '仅检查，不写回 main'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REF: ${{ inputs.ref || 'HEAD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check upstream diff
        id: check
        run: |
          # --check 在存在上游差异时以 exit 1 退出，属于正常信号而非失败
          set +e
          if [ "$UPSTREAM_REF" = "HEAD" ]; then
            node scripts/sync-upstream.js --check --json > /tmp/sync-check.json
          else
            node scripts/sync-upstream.js --check --json --ref "$UPSTREAM_REF" > /tmp/sync-check.json
          fi
          STATUS=$?
          set -e
          cat /tmp/sync-check.json
          if [ "$STATUS" -gt 1 ] || ! node -e "JSON.parse(require('fs').readFileSync('/tmp/sync-check.json', 'utf8'))" 2>/dev/null; then
            echo "::error::sync-upstream --check 未产出可解析结果（exit $STATUS）"
            exit 1
          fi
          # 判断是否有差异
          HAS_DIFF=$(node -p "const j=require('/tmp/sync-check.json'); (j.result.added.length+j.result.updated.length+j.result.removed.length+j.result.renamed.length)>0 ? 'true' : 'false'")
          echo "has_diff=$HAS_DIFF" >> "$GITHUB_OUTPUT"
          HEAD=$(node -p "require('/tmp/sync-check.json').head.slice(0,7)")
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run summary
        if: steps.check.outputs.dry_run == 'true'
        run: |
          echo "Dry run 模式，仅检查不更新"
          cat /tmp/sync-check.json

      - name: Apply sync
        if: steps.check.outputs.has_diff == 'true' && steps.check.outputs.dry_run != 'true'
        run: |
          if [ "$UPSTREAM_REF" = "HEAD" ]; then
            node scripts/sync-upstream.js --apply
          else
            node scripts/sync-upstream.js --apply --ref "$UPSTREAM_REF"
          fi
          echo "=== 应用后状态 ==="

      - name: Build template after sync (if changed)
        if: steps.check.outputs.has_diff == 'true' && steps.check.outputs.dry_run != 'true'
        run: |
          # 上游技能不进 template，但为保险重建一次（幂等）
          npm run build:template
          git status --short

      - name: Validate sync before updating main
        if: steps.check.outputs.has_diff == 'true' && steps.check.outputs.dry_run != 'true'
        run: |
          npm test
          if ! git diff --exit-code -- template/ .agents/skills/ci-guard/ config/proprietary.json 2>&1; then
            echo "::error::template/ 与 .agents/skills 漂移，请检查生成结果"
            git diff --stat
            exit 1
          fi

      - name: Commit and push to main
        if: steps.check.outputs.has_diff == 'true' && steps.check.outputs.dry_run != 'true'
        env:
          UPSTREAM_HEAD: ${{ steps.check.outputs.head }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .agents/skills template/
          if git diff --cached --quiet; then
            echo "No sync changes to commit"
            exit 0
          fi
          git commit -m "chore(upstream): sync mattpocock/skills to $UPSTREAM_HEAD"
          git push origin HEAD:main

      - name: No diff summary
        if: steps.check.outputs.has_diff == 'false'
        run: echo "✅ 上游已是最新，无需同步"
