name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git branch -a --contains "$TAG_COMMIT" | grep -qE "main|origin/main"; then
            echo "Tag $GITHUB_REF is not on main branch, skipping publish"
            echo "Branches containing tag:"
            git branch -a --contains "$TAG_COMMIT" || true
            exit 1
          fi
          echo "Tag $GITHUB_REF is on main, proceeding"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $TAG from tag $GITHUB_REF"
          npm version "$TAG" --no-git-tag-version --allow-same-version
          echo "package.json version is now $(node -p "require('./package.json').version")"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
